<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self' https://api.github.com; base-uri 'none'; form-action 'none'">
  <title>拿铁信息屏 · 管理后台</title>
  <link rel="stylesheet" href="style.css?v=2">
  <script defer src="../screen-data.js"></script>
  <script defer src="github-repository.js"></script>
  <script defer src="credential-vault.js"></script>
  <script defer src="admin.js?v=2"></script>
</head>
<body>
  <main>
    <header>
      <div class="brand">拿铁健身工作室 <span>V2.10.6</span></div>
      <a href="../">打开信息屏 ↗</a>
      <h1>信息屏管理</h1>
      <p>调整每日卫生值班和海报顺序。发布后，网页与已连接的电视会自动更新。</p>
    </header>

    <section>
      <h2>进入管理后台</h2>
      <form id="unlock" hidden>
        <label>后台密码 <input id="unlock-password" required type="password" maxlength="256" autocomplete="current-password"></label>
        <button type="submit" class="primary">解锁后台</button>
        <button type="button" id="use-token">改用令牌</button>
        <p class="hint full-width">密码用于解锁此浏览器加密保存的令牌。令牌到期或忘记密码时，可用令牌重新配置。</p>
      </form>
      <form id="connection">
        <label>仓库 <input id="repository" required placeholder="账号名/仓库名" autocomplete="off"></label>
        <label>细粒度令牌 <input id="token" required type="password" autocomplete="off" spellcheck="false"></label>
        <label id="remember-option" class="remember full-width" hidden>
          <input id="remember" type="checkbox"> 以后用密码解锁（仅此浏览器）
        </label>
        <fieldset id="password-setup" class="password-setup full-width" hidden disabled>
          <label>设置后台密码 <input id="new-password" required type="password" minlength="12" maxlength="256" autocomplete="new-password"></label>
          <label>确认后台密码 <input id="confirm-password" required type="password" minlength="12" maxlength="256" autocomplete="new-password"></label>
        </fieldset>
        <div class="login-actions full-width">
          <button type="submit" class="primary">读取仓库</button>
          <button type="button" id="use-password" hidden>返回密码解锁</button>
        </div>
        <p class="hint full-width">首次设置需要此仓库的 Contents 读写令牌。密码至少 12 个字符，请使用自己的电脑设置。</p>
      </form>
      <div id="connected" class="login-actions" hidden>
        <button type="button" id="reload-repository">重新读取仓库</button>
        <button type="button" id="lock-admin">锁定后台</button>
      </div>
    </section>

    <fieldset id="editor" disabled>
      <section>
        <div class="heading">
          <h2>值班轮值</h2>
          <label class="toggle"><input id="use-duty" type="checkbox"> 使用在线名单</label>
        </div>
        <div id="duty-editor" hidden>
          <ol id="roster" class="rows"></ol>
          <button id="add-person" type="button">＋ 添加人员</button>
          <div class="anchor">
            <label>基准日期 <input id="anchor-date" type="date"></label>
            <label>当天值班人 <select id="anchor-person"></select></label>
          </div>
          <p id="duty-preview" class="hint"></p>
        </div>
        <p id="duty-local" class="hint">电视使用原有本地名单。</p>
      </section>

      <section>
        <div class="heading">
          <h2>播放海报 <small id="poster-count"></small></h2>
          <label class="toggle"><input id="use-posters" type="checkbox"> 使用在线海报</label>
        </div>
        <div id="poster-editor" hidden>
          <label class="upload">导入 JPG / PNG <input id="upload" type="file" accept="image/jpeg,image/png" multiple></label>
          <p class="hint">列表从上到下循环播放，每张 10 秒，最多 20 张。删除全部后发布会清空在线播放列表。</p>
          <ol id="posters" class="rows"></ol>
        </div>
        <p id="posters-local" class="hint">电视播放本地海报，网页版等待在线海报。</p>
      </section>

      <footer>
        <button id="publish" type="button" class="primary">发布到信息屏</button>
        <span id="draft" class="hint"></span>
      </footer>
    </fieldset>
    <p id="status" role="status" aria-live="polite">请连接已上传信息屏网页的仓库。</p>
  </main>
</body>
</html>
